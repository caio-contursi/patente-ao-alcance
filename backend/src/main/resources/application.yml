server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: patente-ao-alcance-api
  jackson:
    default-property-inclusion: non_null

app:
  web:
    allowed-origin: ${WEB_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

research:
  ollama-url: ${RESEARCH_OLLAMA_URL:http://127.0.0.1:11434/api/chat}
  ollama-model: ${RESEARCH_OLLAMA_MODEL:qwen2.5:1.5b}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
